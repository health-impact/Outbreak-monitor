# ===== إعدادات محرك الخطر =====
# القيم من 0 إلى 10. القيمة 5 = لم تُعبّأ بعد (مؤقتة).

# غيّرها إلى true بعد ما تنتهي من تعبئة الجداول (قسم "تعبئتك أنت" تحت)
tables_filled: false

weights:            # مجموعها 100
  proximity: 30     # القرب الجغرافي
  severity: 25      # خطورة المرض
  spread: 20        # سرعة الانتشار (تُحسب تلقائياً)
  mobility: 15      # التنقل مع ليبيا
  readiness: 10     # ضعف جاهزية النظام الصحي في ليبيا

levels:             # حدود المستويات
  - {min: 0,  id: monitor,      ar: مراقبة, en: Monitoring}
  - {min: 25, id: alert,        ar: تنبيه,  en: Alert}
  - {min: 50, id: preparedness, ar: تأهب,   en: Preparedness}
  - {min: 75, id: emergency,    ar: طوارئ,  en: Emergency}

# القرب الجغرافي (ثابت)
proximity:
  LY: 10
  TN: 8
  DZ: 8
  EG: 8
  SD: 8
  TD: 8
  NE: 8
  IT: 5
  MT: 5
  GLOBAL: 2

# ---------- تعبئتك أنت ----------

# جاهزية النظام الصحي الليبي: كلما كان أضعف ارتفع الرقم (0 = جاهز جداً، 10 = ضعيف جداً)
readiness_gap: 5

# خطورة كل مرض (0 = خفيف، 10 = شديد الخطورة)
# قيم أولية مبنية على تصنيفات منظمة الصحة العالمية (الأمراض ذات الأولوية، الطوارئ الصحية
# الدولية، معدلات الوفاة والعدوى). ليست درجات رسمية من المنظمة، وتحتاج مراجعتك.
severity:
  cholera: 8
  measles: 7
  covid_flu: 7
  vhf: 10
  polio: 8
  malaria: 5
  dengue: 5
  rvf: 7
  rabies: 4
  mpox: 6
  meningitis: 7
  amr: 6

# حركة التنقل بين كل دولة وليبيا (0 = شبه معدومة، 10 = كثيفة جداً)
mobility:
  LY: 10
  TN: 5
  DZ: 5
  EG: 5
  SD: 5
  TD: 5
  NE: 5
  IT: 5
  MT: 5
  GLOBAL: 5
